name: ci

on:
  push:
    branches: [main]
  # A release pull request only writes the changelog and the version. It is
  # made with the workflow's own token, which starts no run that works, and
  # release.yml checks the release itself.
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - version.txt
  workflow_call: # release.yml checks a release with it

# A newer push to the same ref makes the older run pointless. When release.yml
# calls this workflow, github.workflow is "release", so the release's check
# and the normal run on main do not cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lotse
          POSTGRES_PASSWORD: lotse
          POSTGRES_DB: lotse
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U lotse"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run setup
      - run: mise run check

  # The image builds; release.yml builds and pushes it for releases.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
