# lotse.sh is site/ and the pages internal/sitegen makes from docs/,
# published by GitHub Pages (decision 0022).
name: site

on:
  push:
    branches: [main]
    paths: [site/**, docs/**, internal/sitegen/**, go.mod, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: go
      - run: go run ./internal/sitegen -out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
