components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: lotse_session
    bearer:
      type: http
      scheme: bearer
      description: An API token, lotse_tok_…, for /api/v1.

  headers:
    SetCookie:
      description: The session cookie.
      schema: { type: string }

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    From:
      name: from
      in: query
      description: Start, in Unix seconds. Defaults to an hour before to.
      schema: { type: integer, format: int64 }
    To:
      name: to
      in: query
      description: End, in Unix seconds. Defaults to now.
      schema: { type: integer, format: int64 }
    Points:
      name: points
      in: query
      description: >
        About how many points to return. Readings are averaged over steps
        long enough to stay below it. Defaults to 600.
      schema: { type: integer, minimum: 1, maximum: 5000 }

  responses:
    Forbidden:
      description: Only an admin may do this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AlreadySetUp:
      description: The hub is already set up, or past this step.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidSetupToken:
      description: The setup token is not the current one.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The request is not valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: There is no such object.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Health:
      type: object
      required: [status, version, agents]
      properties:
        status: { type: string, example: ok }
        version: { type: string }
        database:
          type: string
          enum: [sqlite, postgres]
          description: Missing until setup has chosen one.
        setup: { $ref: "#/components/schemas/SetupStep" }
        agents:
          type: integer
          description: How many agents are connected.

    SetupStep:
      type: string
      enum: [database, admin]
      description: >
        What setup needs next; missing once the hub is set up. Setup takes
        the one-time token from the hub's log.

    SetupToken:
      type: object
      required: [token]
      properties:
        token: { type: string }

    User:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, viewer] }

    Scope:
      type: object
      required: [id, kind, slug, name, path]
      properties:
        id: { type: integer, format: int64 }
        parent_id:
          type: integer
          format: int64
          nullable: true
          description: The customer of a project, the project of an environment; null for customers.
        kind: { type: string, enum: [customer, project, environment] }
        slug:
          type: string
          description: The key within its parent.
        name: { type: string }
        path:
          type: string
          description: The stable key, such as acme/shop/prod.

    ScopeName:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          description: Lowercase letters, digits and dashes, up to 40.
        name: { type: string }

    Change:
      type: object
      required: [id, at, batch_id, actor_kind, actor_name, via, subject_kind, subject_id, subject_path, field]
      properties:
        id: { type: integer, format: int64 }
        at: { type: integer, format: int64 }
        batch_id:
          type: string
          description: The same for everything one save, apply or deploy changed.
        actor_kind: { type: string, enum: [user, token, label, system] }
        actor_name: { type: string }
        via: { type: string, enum: [ui, apply, label, api, setup, system] }
        subject_kind: { type: string }
        subject_id: { type: integer, format: int64 }
        subject_path: { type: string }
        field:
          type: string
          description: The changed field, or created or deleted.
        old:
          description: The value before; missing for something created.
        new:
          description: The value after; missing for something deleted.

    ConfigLevel:
      type: object
      required: [kind, id, path, name]
      properties:
        kind: { type: string, enum: [check, host, container, environment, project, customer, global] }
        id: { type: integer, format: int64 }
        path: { type: string }
        name: { type: string }

    ConfigValue:
      type: object
      required: [key, type, description, value, overrides]
      properties:
        key: { type: string, example: agent.interval.host }
        type: { type: string, enum: [duration, bool, window, probes, channels, threshold, level, url] }
        description: { type: string }
        value:
          description: The effective value.
        from:
          $ref: "#/components/schemas/ConfigLevel"
        overrides:
          type: array
          description: Values set further up that this one overrides, nearest first.
          items: { $ref: "#/components/schemas/ConfigOverride" }

    ConfigOverride:
      type: object
      required: [level, value]
      properties:
        level: { $ref: "#/components/schemas/ConfigLevel" }
        value: {}

    Enrollment:
      type: object
      required: [token, created_at, created_by, hub]
      properties:
        token:
          type: string
          description: The enrollment token, lotse_enr_….
        created_at: { type: integer, format: int64 }
        created_by: { type: string }
        hub:
          type: string
          description: The hub's address, for the install commands.

    Updates:
      type: object
      required: [hub_version, can_update_hub]
      properties:
        hub_version: { type: string }
        can_update_hub:
          type: boolean
          description: Whether the hub runs under the starter and can update itself.
        latest: { $ref: "#/components/schemas/Release" }
        checked_at:
          type: integer
          format: int64
          description: When the hub last looked.
        check_error:
          type: string
          description: Why the last look failed, if it did.

    Release:
      type: object
      required: [version, published_at, url, notes]
      properties:
        version: { type: string, example: 0.1.2 }
        published_at: { type: integer, format: int64 }
        url: { type: string }
        notes:
          type: string
          description: The release notes, in Markdown.

    CheckInput:
      type: object
      required: [environment_id, name, type, spec]
      properties:
        environment_id: { type: integer, format: int64 }
        slug:
          type: string
          description: Its key in the environment; made from the name if missing.
        name: { type: string }
        type: { type: string, enum: [http, tls, tcp, heartbeat] }
        spec:
          type: object
          additionalProperties: true
          description: >
            http: url, keyword, status (such as 200-299); tls: address
            (host:port), server_name; tcp: address; heartbeat: period, grace
            (such as 24h and 1h).

    Check:
      type: object
      required: [id, environment_id, slug, path, name, type, spec, state]
      properties:
        id: { type: integer, format: int64 }
        environment_id: { type: integer, format: int64 }
        slug: { type: string }
        path:
          type: string
          description: The stable key, such as acme/shop/prod/homepage.
        name: { type: string }
        type: { type: string, enum: [http, tls, tcp, heartbeat] }
        spec:
          type: object
          additionalProperties: true
        state: { type: string, enum: [up, down, unknown] }
        state_since: { type: integer, format: int64 }
        latency_ms:
          type: number
          format: double
          description: The newest run's response time, from the hub's probe if it runs the check.
        cert_not_after:
          type: integer
          format: int64
          description: When the certificate expires, if there is one.
        error:
          type: string
          description: Why the newest failing run failed.
        last_ping:
          type: integer
          format: int64
          description: A heartbeat's last ping.
        ping_url:
          type: string
          description: Where a heartbeat is pinged; shown to admins only.

    CheckDetail:
      allOf:
        - $ref: "#/components/schemas/Check"
        - type: object
          required: [probes]
          properties:
            probes:
              type: array
              description: Each probe's newest result.
              items: { $ref: "#/components/schemas/CheckResult" }

    CheckResult:
      type: object
      required: [probe, ts, ok]
      properties:
        probe:
          type: string
          description: The probe's name.
        ts: { type: integer, format: int64 }
        ok: { type: boolean }
        latency_ms: { type: number, format: double }
        status_code: { type: integer }
        cert_not_after: { type: integer, format: int64 }
        error: { type: string }

    Probe:
      type: object
      required: [id, slug, name, location, builtin, online, version]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        location: { type: string }
        builtin:
          type: boolean
          description: The hub's own probe.
        online: { type: boolean }
        version: { type: string }
        last_seen: { type: integer, format: int64 }
        revoked: { type: boolean }

    Host:
      type: object
      required: [id, name, hostname, os, platform, kernel, arch, cpu_model, cores, mem_total,
        boot_time, agent_version, docker_version, first_seen, last_seen, online, agent_revoked, waiting]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        hostname: { type: string }
        os: { type: string }
        platform: { type: string }
        kernel: { type: string }
        arch: { type: string }
        cpu_model: { type: string }
        cores: { type: integer }
        mem_total: { type: integer, format: int64 }
        boot_time: { type: integer, format: int64 }
        agent_version: { type: string }
        docker_version:
          type: string
          description: Empty when the agent cannot reach Docker.
        first_seen: { type: integer, format: int64 }
        last_seen: { type: integer, format: int64 }
        online:
          type: boolean
          description: Whether its agent is connected now.
        agent_revoked:
          type: boolean
          description: Whether its agent's credential is revoked; it comes back only by enrolling again.
        waiting:
          type: boolean
          description: Named in lotse.yaml, it waits for its agent to enroll.
        environment_id:
          type: integer
          format: int64
          nullable: true
          description: Its environment; null until it is put into one.
        clock_offset:
          type: integer
          format: int64
          description: >-
            How many seconds its machine's clock is behind the hub's, negative
            when ahead; only when off by more than 30 seconds. Its readings are
            moved to the hub's time.

    HostReading:
      type: object
      required: [ts]
      properties:
        ts: { type: integer, format: int64 }
        cpu: { type: number, format: double, nullable: true }
        iowait: { type: number, format: double, nullable: true }
        steal: { type: number, format: double, nullable: true }
        load1: { type: number, format: double, nullable: true }
        load5: { type: number, format: double, nullable: true }
        load15: { type: number, format: double, nullable: true }
        mem_used: { type: integer, format: int64, nullable: true }
        mem_available: { type: integer, format: int64, nullable: true }
        swap_used: { type: integer, format: int64, nullable: true }
        swap_total: { type: integer, format: int64, nullable: true }
        net_rx: { type: number, format: double, nullable: true }
        net_tx: { type: number, format: double, nullable: true }
        disk_read: { type: number, format: double, nullable: true }
        disk_write: { type: number, format: double, nullable: true }
        uptime: { type: integer, format: int64, nullable: true }

    HostSummary:
      type: object
      required: [host, containers]
      properties:
        host: { $ref: "#/components/schemas/Host" }
        latest: { $ref: "#/components/schemas/HostReading" }
        disk:
          type: number
          format: double
          nullable: true
          description: Usage of its fullest filesystem, in percent.
        containers: { $ref: "#/components/schemas/ContainerCounts" }

    ContainerCounts:
      type: object
      required: [total, running, unhealthy]
      properties:
        total: { type: integer }
        running: { type: integer }
        unhealthy: { type: integer }

    HostDetail:
      type: object
      required: [host, filesystems, containers]
      properties:
        host: { $ref: "#/components/schemas/Host" }
        latest: { $ref: "#/components/schemas/HostReading" }
        filesystems:
          type: array
          items: { $ref: "#/components/schemas/Filesystem" }
        containers:
          type: array
          description: Its containers, those still there first.
          items: { $ref: "#/components/schemas/Container" }

    Filesystem:
      type: object
      required: [id, mount, device, fstype, last_seen]
      properties:
        id: { type: integer, format: int64 }
        mount: { type: string }
        device: { type: string }
        fstype: { type: string }
        last_seen: { type: integer, format: int64 }
        used: { type: integer, format: int64, nullable: true }
        total: { type: integer, format: int64, nullable: true }

    Container:
      type: object
      required: [id, host_id, host_name, slug, docker_id, name, image, compose_project,
        compose_service, state, health, exit_code, restarts, started_at, labels,
        first_seen, last_seen]
      properties:
        ignored:
          type: boolean
          description: Whether lotse leaves it alone (the ignore setting, as lotse.ignore sets it).
        id: { type: integer, format: int64 }
        host_id: { type: integer, format: int64 }
        host_name: { type: string }
        slug: { type: string }
        docker_id: { type: string }
        name: { type: string }
        image: { type: string }
        compose_project: { type: string }
        compose_service: { type: string }
        state:
          type: string
          description: Docker's state, such as running or exited.
        health:
          type: string
          description: Empty without a health check.
        exit_code: { type: integer }
        restarts: { type: integer }
        started_at: { type: integer, format: int64 }
        labels:
          type: object
          additionalProperties: { type: string }
        first_seen: { type: integer, format: int64 }
        last_seen: { type: integer, format: int64 }
        gone_at:
          type: integer
          format: int64
          nullable: true
          description: When its host last listed it, if it no longer does.
        latest: { $ref: "#/components/schemas/ContainerReading" }

    ContainerReading:
      type: object
      required: [ts]
      properties:
        ts: { type: integer, format: int64 }
        cpu:
          type: number
          format: double
          nullable: true
          description: Percent of one core.
        mem: { type: integer, format: int64, nullable: true }
        mem_limit: { type: integer, format: int64, nullable: true }
        net_rx: { type: number, format: double, nullable: true }
        net_tx: { type: number, format: double, nullable: true }

    Series:
      type: object
      description: >
        Readings in columns, as charts take them: time holds the start of
        each step, each column one value per step (null where nothing was
        measured).
      required: [time, step, columns]
      properties:
        time:
          type: array
          items: { type: integer, format: int64 }
        step:
          type: integer
          format: int64
          description: Seconds per step.
        columns:
          type: object
          additionalProperties:
            type: array
            items: { type: number, format: double, nullable: true }

    Event:
      type: object
      required: [id, ts, subject_kind, subject_id, kind, data]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: integer, format: int64 }
        subject_kind: { type: string, enum: [host, container, check, hub] }
        subject_id: { type: integer, format: int64 }
        kind:
          type: string
          example: container.die
        data:
          type: object
          additionalProperties: true

    AlertState:
      type: object
      description: Where a rule stands on an object.
      required: [rule, description, subject_kind, subject_id, subject_path, instance, state, since,
        unit, alert_id, in_maintenance, notified_state]
      properties:
        rule: { type: string, example: host.disk }
        description: { type: string }
        subject_kind: { type: string, enum: [host, container, check, probe, channel] }
        subject_id: { type: integer, format: int64 }
        subject_path: { type: string, example: acme/shop/prod/web1 }
        instance:
          type: string
          description: What on the object, such as a filesystem's mount point; empty for most rules.
        state: { type: string, enum: [ok, warn, crit, unknown] }
        since: { type: integer, format: int64 }
        pending:
          type: string
          enum: [warn, crit]
          description: The state it goes to, once it has held for the rule's for.
        value: { type: number, format: double }
        threshold: { type: number, format: double }
        unit:
          type: string
          description: What value and threshold are in; empty for a rule on a condition.
          enum: ["", percent, count, days, load]
        alert_id:
          type: integer
          format: int64
          description: The transition into the state.
        reason: { type: string }
        in_maintenance: { type: boolean }
        notified_state:
          type: string
          description: The state last sent.
        acked_by: { type: string }
        acked_at: { type: integer, format: int64 }

    Alert:
      type: object
      description: A transition of a rule on an object.
      required: [id, rule, subject_kind, subject_id, subject_path, instance, from, to, at, unit, reason, in_maintenance]
      properties:
        id: { type: integer, format: int64 }
        rule: { type: string }
        subject_kind: { type: string, enum: [host, container, check, probe, channel] }
        subject_id: { type: integer, format: int64 }
        subject_path: { type: string }
        instance: { type: string }
        from: { type: string, enum: [ok, warn, crit, unknown] }
        to: { type: string, enum: [ok, warn, crit, unknown] }
        at: { type: integer, format: int64 }
        value: { type: number, format: double }
        threshold: { type: number, format: double }
        unit: { type: string, enum: ["", percent, count, days, load] }
        reason: { type: string }
        in_maintenance:
          type: boolean
          description: It happened during maintenance, so it was not sent then.

    AlertDetail:
      allOf:
        - $ref: "#/components/schemas/Alert"
        - type: object
          required: [description, settings, notifications]
          properties:
            description: { type: string }
            settings:
              type: array
              description: The rule's settings as they applied, and where each came from.
              items: { $ref: "#/components/schemas/RuleSetting" }
            notifications:
              type: array
              items: { $ref: "#/components/schemas/Notification" }

    RuleSetting:
      type: object
      required: [key, value]
      properties:
        key: { type: string, example: rules.host.disk.crit }
        value: {}
        from:
          $ref: "#/components/schemas/ConfigLevel"

    Notification:
      type: object
      required: [id, channel, kind, status, attempts, created_at]
      properties:
        id: { type: integer, format: int64 }
        channel:
          type: string
          description: The channel's key, with its scope's path.
        channel_id: { type: integer, format: int64 }
        kind: { type: string, enum: [change, repeat] }
        status:
          type: string
          enum: [pending, sent, failed, suppressed]
          description: suppressed means held back during maintenance.
        attempts: { type: integer }
        error: { type: string }
        created_at: { type: integer, format: int64 }
        sent_at: { type: integer, format: int64 }

    SecretInfo:
      type: object
      description: Whether a secret is set, and where it comes from; never the secret.
      required: [set]
      properties:
        set: { type: boolean }
        env:
          type: string
          description: The environment variable the hub reads it from.
        file:
          type: string
          description: The file the hub reads it from.

    SecretInput:
      type: object
      description: >
        A secret: its value, which the hub keeps sealed, or where the hub
        reads it when it sends, an environment variable or a file in
        /run/secrets. An empty object removes it.
      properties:
        value: { type: string }
        env: { type: string }
        file: { type: string }

    Channel:
      type: object
      required: [id, scope_id, scope_path, key, name, type, spec, secrets]
      properties:
        id: { type: integer, format: int64 }
        scope_id: { type: integer, format: int64 }
        scope_path:
          type: string
          description: Empty for the global scope.
        key: { type: string, example: ops-mail }
        name: { type: string }
        type: { type: string, enum: [email, googlechat, webhook] }
        spec:
          type: object
          additionalProperties: true
          description: >
            email: to, a list of addresses, and smtp, a mail server of its own
            (host, port, username, from, tls). googlechat and webhook: nothing.
        secrets:
          type: object
          description: >
            email: password, for its own mail server. googlechat: url, the
            webhook. webhook: url, and signing_key.
          additionalProperties: { $ref: "#/components/schemas/SecretInfo" }

    ChannelInput:
      type: object
      required: [scope_id, key, name, type, spec]
      properties:
        scope_id: { type: integer, format: int64 }
        key: { type: string }
        name: { type: string }
        type: { type: string, enum: [email, googlechat, webhook] }
        spec: { type: object, additionalProperties: true }
        secrets:
          type: object
          additionalProperties: { $ref: "#/components/schemas/SecretInput" }

    ChannelUpdate:
      type: object
      required: [name, spec]
      properties:
        name: { type: string }
        spec: { type: object, additionalProperties: true }
        secrets:
          type: object
          description: The secrets to change; those not named stay as they are.
          additionalProperties: { $ref: "#/components/schemas/SecretInput" }

    TestResult:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean }
        error: { type: string }

    MailServer:
      type: object
      required: [host, port, username, from, tls, password]
      properties:
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        from: { type: string, example: lotse <lotse@example.com> }
        tls: { type: string, enum: [starttls, tls, none] }
        password: { $ref: "#/components/schemas/SecretInfo" }

    MailServerInput:
      type: object
      required: [host, port, from, tls]
      properties:
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        from: { type: string }
        tls: { type: string, enum: [starttls, tls, none] }
        password:
          $ref: "#/components/schemas/SecretInput"

    Maintenance:
      type: object
      required: [id, subject_kind, subject_id, subject_path, reason, created_by, created_at, active]
      properties:
        id: { type: integer, format: int64 }
        subject_kind: { type: string, enum: [host, container, check, environment, project, customer, global] }
        subject_id: { type: integer, format: int64 }
        subject_path: { type: string }
        starts_at: { type: integer, format: int64 }
        ends_at: { type: integer, format: int64 }
        schedule:
          type: string
          description: A window that comes back, in the hub's time zone, such as sun 02:00-04:00.
          example: sun 02:00-04:00
        reason: { type: string }
        created_by: { type: string }
        created_at: { type: integer, format: int64 }
        active:
          type: boolean
          description: Whether it covers now.

    MaintenanceInput:
      type: object
      required: [subject]
      description: Either starts_at and ends_at, or schedule.
      properties:
        subject:
          type: string
          description: The object or scope, as kind:id.
        starts_at: { type: integer, format: int64 }
        ends_at: { type: integer, format: int64 }
        schedule: { type: string }
        reason: { type: string }

    ApplyResult:
      type: object
      required: [changes, warnings, applied]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/ApplyChange" }
        warnings:
          type: array
          items: { type: string }
        applied:
          type: boolean
          description: False for a dry run.

    ApplyChange:
      type: object
      required: [action, kind, path]
      properties:
        action: { type: string, enum: [create, update, delete] }
        kind: { type: string }
        path: { type: string }
        field: { type: string }
        old: {}
        new: {}
        last:
          type: object
          description: Who changed it last, and how.
          required: [at, by, via]
          properties:
            at: { type: integer, format: int64 }
            by: { type: string }
            via: { type: string }

    Token:
      type: object
      required: [id, name, kind, scope_id, scope_path, created_by, created_at, revoked]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [read, apply] }
        scope_id: { type: integer, format: int64 }
        scope_path:
          type: string
          description: Empty for all.
        created_by: { type: string }
        created_at: { type: integer, format: int64 }
        last_used_at: { type: integer, format: int64 }
        revoked: { type: boolean }

    NewToken:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/Token" }
        secret:
          type: string
          description: The token itself, lotse_tok_…; it is not shown again.

    Status:
      type: object
      description: How everything stands, in figures.
      required: [level, hosts, hosts_online, checks, checks_up, critical, warnings]
      properties:
        level:
          type: string
          enum: [ok, warn, crit]
          description: The worst firing alert, or ok.
        hosts: { type: integer }
        hosts_online: { type: integer }
        checks: { type: integer }
        checks_up: { type: integer }
        critical:
          type: integer
          description: Alerts firing at CRIT.
        warnings:
          type: integer
          description: Alerts firing at WARN.
