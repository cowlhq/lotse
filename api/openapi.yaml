        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createToken
      summary: Make an API token; its secret is shown this once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, scope_id]
              properties:
                name: { type: string }
                kind: { type: string, enum: [read, apply] }
                scope_id:
                  type: integer
                  format: int64
                  description: The scope it works on, with everything below; 1 for all.
      responses:
        "201":
          description: The token, and its secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/tokens/{id}:
