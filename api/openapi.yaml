openapi: 3.0.3
info:
  title: lotse
  version: "1"
  description: |
    The HTTP API of a lotse hub. The web interface uses it, and so can
    anything else. Times are Unix seconds, sizes bytes, rates bytes per
    second, and shares percent (0 to 100).

    Live data comes over a WebSocket at /api/live, which is not described
    here.

    Everything but health, setup and login needs a session: the cookie
    lotse_session, which logging in sets. Without one, the answer is 401.

    The part under /api/v1, tagged read, is the read API for other
    programs: it is kept stable, takes an API token (Authorization: Bearer
    lotse_tok_…) of either kind, and shows only what is in the token's scope.
    The Go client lotse.sh/client is made from it. The rest is the web
    interface's own and may change with it.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html

security:
  - session: []

tags:
  - name: read
    description: The read API, for other programs; stable.

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Whether the hub runs, and how
      security: []
      responses:
        "200":
          description: The hub runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/setup/check:
    post:
      operationId: checkSetup
      summary: Whether a setup link is the current one, and what setup needs next
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupToken" }
      responses:
        "200":
          description: Whether the token is valid, and the next step if it is.
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean }
                  step: { $ref: "#/components/schemas/SetupStep" }
                  postgres:
                    type: string
                    description: >
                      A Postgres URL the hub could connect to, such as the one
                      of the compose file's postgres profile.
        "409": { $ref: "#/components/responses/AlreadySetUp" }

  /api/setup/database:
    post:
      operationId: setupDatabase
      summary: Choose the database, the first step of setup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SetupToken"
                - type: object
                  required: [kind]
                  properties:
                    kind: { type: string, enum: [sqlite, postgres] }
                    url:
                      type: string
                      description: The Postgres URL; not used for SQLite.
      responses:
        "204":
          description: >
            The database works and is saved. The hub switches to it; the next
            step is the admin.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/InvalidSetupToken" }
        "409": { $ref: "#/components/responses/AlreadySetUp" }

  /api/setup/admin:
    post:
      operationId: setupAdmin
      summary: Create the first admin, the last step of setup
      description: The admin is logged in right away.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SetupToken"
                - type: object
                  required: [name, email, password, url]
                  properties:
                    name: { type: string }
                    email: { type: string }
                    password: { type: string }
                    url:
                      type: string
                      description: Where people and agents reach the hub.
      responses:
        "200":
          description: The admin, logged in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/InvalidSetupToken" }
        "409": { $ref: "#/components/responses/AlreadySetUp" }

  /api/auth/login:
    post:
      operationId: login
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Wrong email or password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many failed attempts; try again later.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/logout:
    post:
      operationId: logout
      summary: Log out
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }

  /api/auth/me:
    get:
      operationId: getMe
      summary: Who is logged in
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /api/scopes:
    get:
      operationId: listScopes
      summary: The tree of customers, projects and environments
      description: Every scope but the global one, by path. parent_id links them.
      responses:
        "200":
          description: The scopes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scope" }

  /api/scopes/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getScope
      summary: A customer, project or environment
      responses:
        "200":
          description: The scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scope" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: renameScope
      summary: Rename a scope; its key stays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: The renamed scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteScope
      summary: Delete a scope that is empty
      responses:
        "204":
          description: Deleted.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: It still has scopes or hosts in it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/scopes/{id}/enrollment:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getEnrollment
      summary: An environment's enrollment token, for the install commands
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: There is no such environment, or it has no token yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: newEnrollment
      summary: Make a new enrollment token for an environment
      description: >
        The token it had stops working. Agents that enrolled with it keep
        their own credentials.
      responses:
        "200":
          description: The new token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/hosts/{id}/agent:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: revokeAgent
      summary: Revoke the host's agent credential and disconnect it
      description: >
        The agent can only come back by enrolling again, with a current
        enrollment token and its old credential deleted.
      responses:
        "204":
          description: Revoked.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/environments:
    post:
      operationId: createEnvironment
      summary: Create an environment, and its customer and project if needed
      description: >
        Each level is matched by its slug; what exists is used as it is,
        what does not is created with the name given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer, project, environment]
              properties:
                customer: { $ref: "#/components/schemas/ScopeName" }
                project: { $ref: "#/components/schemas/ScopeName" }
                environment: { $ref: "#/components/schemas/ScopeName" }
      responses:
        "201":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/hosts/{id}/environment:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setHostEnvironment
      summary: Put a host into an environment, or take it out of all
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                environment_id:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        "204":
          description: Moved.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/changes:
    get:
      operationId: listChanges
      summary: The history of an object
      parameters:
        - name: subject
          in: query
          required: true
          description: The object, as kind:id, such as environment:4 or host:3.
          schema: { type: string }
      responses:
        "200":
          description: Its changes, newest first, at most 200.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Change" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/config:
    get:
      operationId: getConfig
      summary: The effective settings of an object, and where each comes from
      parameters:
        - name: subject
          in: query
          required: true
          description: >
            check:<id>, host:<id>, container:<id>, environment:<id>,
            project:<id>, customer:<id>, or global:1.
          schema: { type: string }
      responses:
        "200":
          description: Every setting the object has, effective value first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConfigValue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/settings:
    put:
      operationId: setSetting
      summary: Set a setting on an object, or unset it with null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, key, value]
              properties:
                subject: { type: string }
                key: { type: string }
                value:
                  nullable: true
                  description: The value; null unsets it, so it is inherited again.
      responses:
        "204":
          description: Saved.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/updates:
    get:
      operationId: getUpdates
      summary: The hub's version and the newest release
      responses:
        "200":
          description: What is running and what is out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Updates" }
    post:
      operationId: checkUpdates
      summary: Look for a newer release now, instead of at the next check
      responses:
        "200":
          description: What is running and what is out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Updates" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/hub/update:
    post:
      operationId: updateHub
      summary: Update the hub to the newest release
      description: >
        The hub downloads the release, checks its signature, saves a copy of
        a SQLite database, and restarts into it (decision 0009). The UI
        loses it for a few seconds.
      responses:
        "202":
          description: Installed; the hub restarts now.
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: There is nothing newer, or the hub cannot update itself.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/hosts/{id}/update:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: updateHost
      summary: Ask a host's agent to update to the newest release
      responses:
        "202":
          description: Asked; how it goes arrives as events and live.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The agent is not connected, or already has the newest release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/scopes/{id}/update:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: updateScope
      summary: Ask every connected agent below a scope to update
      description: Use global:1's id, 1, for all agents.
      responses:
        "202":
          description: How many agents were asked.
          content:
            application/json:
              schema:
                type: object
                required: [asked]
                properties:
                  asked: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: There is no newer release known.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/checks:
    get:
      operationId: listChecks
      summary: Checks, with their state
      parameters:
        - name: environment
          in: query
          description: Only this environment's.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The checks, by key.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Check" }
    post:
      operationId: createCheck
      summary: Add a check to an environment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckInput" }
      responses:
        "201":
          description: The check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Check" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The environment has a check with this key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/checks/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getCheck
      summary: A check, with each probe's newest result
      responses:
        "200":
          description: The check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateCheck
      summary: Change a check's name and what it checks; its key and type stay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, spec]
              properties:
                name: { type: string }
                spec: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Check" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteCheck
      summary: Delete a check and its results
      responses:
        "204":
          description: Deleted.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/checks/{id}/series:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/From"
      - $ref: "#/components/parameters/To"
      - $ref: "#/components/parameters/Points"
    get:
      operationId: getCheckSeries
      summary: A check's response time and success over time
      description: "Columns: latency_ms, and ok (the share of runs that passed, 0 to 1)."
      responses:
        "200":
          description: The readings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/checks/{id}/results:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/From"
      - $ref: "#/components/parameters/To"
    get:
      operationId: listCheckResults
      summary: A check's runs, newest first, at most 200
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CheckResult" }

  /api/probes:
    get:
      operationId: listProbes
      summary: The probes, the hub's own first
      responses:
        "200":
          description: The probes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Probe" }

  /api/probes/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: revokeProbe
      summary: Revoke a probe and disconnect it
      responses:
        "204":
          description: Revoked.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/probes/enrollment:
    get:
      operationId: getProbeEnrollment
      summary: The token probes enroll with, for their install command
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: There is no probe token yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: newProbeEnrollment
      summary: Make a new probe token; the old one stops working
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/hosts:
    get:
      operationId: listHosts
      summary: All hosts, with their latest reading
      responses:
        "200":
          description: The hosts, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HostSummary" }

  /api/hosts/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getHost
      summary: A host, its filesystems and its containers
      responses:
        "200":
          description: The host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/hosts/{id}/series:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/From"
      - $ref: "#/components/parameters/To"
      - $ref: "#/components/parameters/Points"
    get:
      operationId: getHostSeries
      summary: A host's readings over time
      description: >
        Columns: cpu, iowait, steal, load1, load5, load15, mem_used,
        mem_available, swap_used, swap_total, net_rx, net_tx, disk_read,
        disk_write.
      responses:
        "200":
          description: The readings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/filesystems/{id}/series:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/From"
      - $ref: "#/components/parameters/To"
      - $ref: "#/components/parameters/Points"
    get:
      operationId: getFilesystemSeries
      summary: A filesystem's usage over time
      description: "Columns: used, total, inodes_used, inodes_total."
      responses:
        "200":
          description: The readings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/containers/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getContainer
      summary: A container
      responses:
        "200":
          description: The container.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Container" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/containers/{id}/series:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/From"
      - $ref: "#/components/parameters/To"
      - $ref: "#/components/parameters/Points"
    get:
      operationId: getContainerSeries
      summary: A container's usage over time
      description: "Columns: cpu (percent of one core), mem, mem_limit, net_rx, net_tx."
      responses:
        "200":
          description: The readings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/events:
    get:
      operationId: listEvents
      summary: What happened to an object
      parameters:
        - name: subject
          in: query
          required: true
          description: The object, as kind:id, such as host:3, container:17 or check:5.
          schema: { type: string, pattern: "^(host|container|check):[0-9]+$" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: The events, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/alerts:
    get:
      operationId: listAlerts
      summary: The alerts that are not OK now, the worst first
      parameters:
        - name: subject
          in: query
          description: >
            Only those of this object, or of everything in this scope, as
            kind:id, such as host:3 or environment:4.
          schema: { type: string }
      responses:
        "200":
          description: The alerts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlertState" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/alerts/history:
    get:
      operationId: listAlertHistory
      summary: The transitions of alerts, newest first, at most 500
      parameters:
        - name: subject
          in: query
          description: Only those of this object, or of everything in this scope.
          schema: { type: string }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: The transitions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alert" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/alerts/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getAlert
      summary: A transition, why it happened, and what was sent about it
      responses:
        "200":
          description: The transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/{id}/acknowledge:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: acknowledgeAlert
      summary: Note that someone looks after a firing alert, which stops repeats
      description: >
        The ID is the transition into the alert's current state. A change of
        state, such as from WARN to CRIT, is sent again all the same.
      responses:
        "204":
          description: Acknowledged.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The alert does not fire, or is acknowledged already.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/channels:
    get:
      operationId: listChannels
      summary: Where notifications can go
      parameters:
        - name: scope
          in: query
          description: Only the channels usable in this scope, defined in it or above it.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The channels, by scope and key.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }
    post:
      operationId: createChannel
      summary: Add a channel to a scope
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        "201":
          description: The channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The scope has a channel with this key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/channels/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateChannel
      summary: Change a channel; its scope, key and type stay
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelUpdate" }
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteChannel
      summary: Delete a channel
      responses:
        "204":
          description: Deleted.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/channels/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: testChannel
      summary: Send a test message to a channel
      responses:
        "200":
          description: How it went.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/mail-server:
    get:
      operationId: getMailServer
      summary: The mail server email channels send through
      responses:
        "200":
          description: The mail server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailServer" }
        "404":
          description: There is none yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      operationId: setMailServer
      summary: Set the mail server
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailServerInput" }
      responses:
        "200":
          description: The mail server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailServer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteMailServer
      summary: Remove the mail server
      responses:
        "204":
          description: Removed.
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/mail-server/test:
    post:
      operationId: testMailServer
      summary: Send a test email through the mail server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, format: email }
      responses:
        "200":
          description: How it went.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: There is no mail server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/maintenance:
    get:
      operationId: listMaintenance
      summary: Maintenance windows, the newest first
      parameters:
        - name: subject
          in: query
          description: >
            Only those that cover this object or scope: on it, or on a scope
            above it, as kind:id.
          schema: { type: string }
      responses:
        "200":
          description: The windows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Maintenance" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createMaintenance
      summary: Add a maintenance window, once or by schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceInput" }
      responses:
        "201":
          description: The window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Maintenance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/maintenance/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: deleteMaintenance
      summary: End a maintenance window, or remove one
      responses:
        "204":
          description: Removed.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apply:
    post:
      operationId: applyDocument
      summary: Apply a lotse.yaml, or show what it would change
      description: >
        The document as JSON, as lotse apply sends it: secrets of the form
        from_env are read by lotse apply and sent as value. Objects are
        matched by key; everything happens in one transaction. Needs an
        apply token, or an admin's session; a token limited to a scope can
        change only what is in it.
      security:
        - bearer: []
        - session: []
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean }
        - name: prune
          in: query
          description: Also delete, within scope, what the document does not name.
          schema: { type: boolean }
        - name: scope
          in: query
          description: The path of the scope to prune; the token's scope if not given.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: What changed, or would.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

