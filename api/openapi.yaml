openapi: 3.0.3
info:
  title: lotse
  version: "1"
  description: |
    The HTTP API of a lotse hub. The web interface uses it, and so can
    anything else. Times are Unix seconds, sizes bytes, rates bytes per
    second, and shares percent (0 to 100).

    Live data comes over a WebSocket at /api/live, which is not described
    here.

    Everything but health, setup and login needs a session: the cookie
    lotse_session, which logging in sets. Without one, the answer is 401.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html

security:
  - session: []

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Whether the hub runs, and how
      security: []
      responses:
        "200":
          description: The hub runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/setup/check:
    post:
      operationId: checkSetup
      summary: Whether a setup link is the current one, and what setup needs next
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupToken" }
      responses:
        "200":
          description: Whether the token is valid, and the next step if it is.
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean }
                  step: { $ref: "#/components/schemas/SetupStep" }
                  postgres:
                    type: string
                    description: >
                      A Postgres URL the hub could connect to, such as the one
                      of the compose file's postgres profile.
        "409": { $ref: "#/components/responses/AlreadySetUp" }

  /api/setup/database:
    post:
      operationId: setupDatabase
      summary: Choose the database, the first step of setup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SetupToken"
                - type: object
                  required: [kind]
                  properties:
                    kind: { type: string, enum: [sqlite, postgres] }
                    url:
                      type: string
                      description: The Postgres URL; not used for SQLite.
      responses:
        "204":
          description: >
            The database works and is saved. The hub switches to it; the next
            step is the admin.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/InvalidSetupToken" }
        "409": { $ref: "#/components/responses/AlreadySetUp" }

  /api/setup/admin:
    post:
      operationId: setupAdmin
      summary: Create the first admin, the last step of setup
      description: The admin is logged in right away.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SetupToken"
                - type: object
                  required: [name, email, password, url]
                  properties:
                    name: { type: string }
                    email: { type: string }
                    password: { type: string }
                    url:
                      type: string
                      description: Where people and agents reach the hub.
      responses:
        "200":
          description: The admin, logged in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/InvalidSetupToken" }
        "409": { $ref: "#/components/responses/AlreadySetUp" }

  /api/auth/login:
    post:
      operationId: login
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Wrong email or password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many failed attempts; try again later.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/logout:
    post:
      operationId: logout
      summary: Log out
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }

  /api/auth/me:
    get:
      operationId: getMe
      summary: Who is logged in
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /api/scopes:
    get:
      operationId: listScopes
      summary: The tree of customers, projects and environments
      description: Every scope but the global one, by path. parent_id links them.
      responses:
        "200":
          description: The scopes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scope" }

  /api/scopes/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getScope
      summary: A customer, project or environment
      responses:
        "200":
          description: The scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scope" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: renameScope
      summary: Rename a scope; its key stays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: The renamed scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteScope
      summary: Delete a scope that is empty
      responses:
        "204":
          description: Deleted.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: It still has scopes or hosts in it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/scopes/{id}/enrollment:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getEnrollment
      summary: An environment's enrollment token, for the install commands
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: There is no such environment, or it has no token yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: newEnrollment
      summary: Make a new enrollment token for an environment
      description: >
        The token it had stops working. Agents that enrolled with it keep
        their own credentials.
      responses:
        "200":
          description: The new token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/hosts/{id}/agent:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: revokeAgent
      summary: Revoke the host's agent credential and disconnect it
      description: >
        The agent can only come back by enrolling again, with a current
        enrollment token and its old credential deleted.
      responses:
        "204":
          description: Revoked.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/environments:
    post:
      operationId: createEnvironment
      summary: Create an environment, and its customer and project if needed
      description: >
        Each level is matched by its slug; what exists is used as it is,
        what does not is created with the name given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer, project, environment]
              properties:
                customer: { $ref: "#/components/schemas/ScopeName" }
                project: { $ref: "#/components/schemas/ScopeName" }
                environment: { $ref: "#/components/schemas/ScopeName" }
      responses:
        "201":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/hosts/{id}/environment:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setHostEnvironment
      summary: Put a host into an environment, or take it out of all
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                environment_id:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        "204":
          description: Moved.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/changes:
    get:
      operationId: listChanges
      summary: The history of an object
      parameters:
        - name: subject
          in: query
          required: true
          description: The object, as kind:id, such as environment:4 or host:3.
          schema: { type: string }
      responses:
        "200":
          description: Its changes, newest first, at most 200.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Change" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/config:
    get:
      operationId: getConfig
      summary: The effective settings of an object, and where each comes from
      parameters:
        - name: subject
          in: query
          required: true
          description: >
            host:<id>, environment:<id>, project:<id>, customer:<id>, or
            global:1.
          schema: { type: string }
      responses:
        "200":
          description: Every setting the object has, effective value first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConfigValue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/settings:
    put:
      operationId: setSetting
      summary: Set a setting on an object, or unset it with null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, key, value]
              properties:
                subject: { type: string }
                key: { type: string }
                value:
                  nullable: true
                  description: The value; null unsets it, so it is inherited again.
      responses:
        "204":
          description: Saved.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/updates:
    get:
      operationId: getUpdates
      summary: The hub's version and the newest release
      responses:
        "200":
          description: What is running and what is out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Updates" }
    post:
      operationId: checkUpdates
      summary: Look for a newer release now, instead of at the next check
      responses:
        "200":
          description: What is running and what is out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Updates" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/hub/update:
    post:
      operationId: updateHub
      summary: Update the hub to the newest release
      description: >
        The hub downloads the release, checks its signature, saves a copy of
        a SQLite database, and restarts into it (decision 0009). The UI
        loses it for a few seconds.
      responses:
        "202":
          description: Installed; the hub restarts now.
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: There is nothing newer, or the hub cannot update itself.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/hosts/{id}/update:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: updateHost
      summary: Ask a host's agent to update to the newest release
      responses:
        "202":
          description: Asked; how it goes arrives as events and live.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The agent is not connected, or already has the newest release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/scopes/{id}/update:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: updateScope
      summary: Ask every connected agent below a scope to update
      description: Use global:1's id, 1, for all agents.
      responses:
        "202":
          description: How many agents were asked.
          content:
            application/json:
              schema:
                type: object
                required: [asked]
                properties:
                  asked: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: There is no newer release known.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/hosts:
    get:
      operationId: listHosts
      summary: All hosts, with their latest reading
      responses:
        "200":
          description: The hosts, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HostSummary" }

  /api/hosts/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getHost
      summary: A host, its filesystems and its containers
      responses:
        "200":
          description: The host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/hosts/{id}/series:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/From"
      - $ref: "#/components/parameters/To"
      - $ref: "#/components/parameters/Points"
    get:
      operationId: getHostSeries
      summary: A host's readings over time
      description: >
        Columns: cpu, iowait, steal, load1, load5, load15, mem_used,
        mem_available, swap_used, swap_total, net_rx, net_tx, disk_read,
        disk_write.
      responses:
        "200":
          description: The readings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/filesystems/{id}/series:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/From"
      - $ref: "#/components/parameters/To"
      - $ref: "#/components/parameters/Points"
    get:
      operationId: getFilesystemSeries
      summary: A filesystem's usage over time
      description: "Columns: used, total, inodes_used, inodes_total."
      responses:
        "200":
          description: The readings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/containers/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getContainer
      summary: A container
      responses:
        "200":
          description: The container.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Container" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/containers/{id}/series:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/From"
      - $ref: "#/components/parameters/To"
      - $ref: "#/components/parameters/Points"
    get:
      operationId: getContainerSeries
      summary: A container's usage over time
      description: "Columns: cpu (percent of one core), mem, mem_limit, net_rx, net_tx."
      responses:
        "200":
          description: The readings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/events:
    get:
      operationId: listEvents
      summary: What happened to an object
      parameters:
        - name: subject
          in: query
          required: true
          description: The object, as kind:id, such as host:3 or container:17.
          schema: { type: string, pattern: "^(host|container):[0-9]+$" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: The events, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: lotse_session

  headers:
    SetCookie:
      description: The session cookie.
      schema: { type: string }

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    From:
      name: from
      in: query
      description: Start, in Unix seconds. Defaults to an hour before to.
      schema: { type: integer, format: int64 }
    To:
      name: to
      in: query
      description: End, in Unix seconds. Defaults to now.
      schema: { type: integer, format: int64 }
    Points:
      name: points
      in: query
      description: >
        About how many points to return. Readings are averaged over steps
        long enough to stay below it. Defaults to 600.
      schema: { type: integer, minimum: 1, maximum: 5000 }

  responses:
    Forbidden:
      description: Only an admin may do this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AlreadySetUp:
      description: The hub is already set up, or past this step.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidSetupToken:
      description: The setup token is not the current one.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The request is not valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: There is no such object.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Health:
      type: object
      required: [status, version, agents]
      properties:
        status: { type: string, example: ok }
        version: { type: string }
        database:
          type: string
          enum: [sqlite, postgres]
          description: Missing until setup has chosen one.
        setup: { $ref: "#/components/schemas/SetupStep" }
        agents:
          type: integer
          description: How many agents are connected.

    SetupStep:
      type: string
      enum: [database, admin]
      description: >
        What setup needs next; missing once the hub is set up. Setup takes
        the one-time token from the hub's log.

    SetupToken:
      type: object
      required: [token]
      properties:
        token: { type: string }

    User:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, viewer] }

    Scope:
      type: object
      required: [id, kind, slug, name, path]
      properties:
        id: { type: integer, format: int64 }
        parent_id:
          type: integer
          format: int64
          nullable: true
          description: The customer of a project, the project of an environment; null for customers.
        kind: { type: string, enum: [customer, project, environment] }
        slug:
          type: string
          description: The key within its parent.
        name: { type: string }
        path:
          type: string
          description: The stable key, such as acme/shop/prod.

    ScopeName:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          description: Lowercase letters, digits and dashes, up to 40.
        name: { type: string }

    Change:
      type: object
      required: [id, at, batch_id, actor_kind, actor_name, via, subject_kind, subject_id, subject_path, field]
      properties:
        id: { type: integer, format: int64 }
        at: { type: integer, format: int64 }
        batch_id:
          type: string
          description: The same for everything one save, apply or deploy changed.
        actor_kind: { type: string, enum: [user, token, label, system] }
        actor_name: { type: string }
        via: { type: string, enum: [ui, apply, label, api, setup, system] }
        subject_kind: { type: string }
        subject_id: { type: integer, format: int64 }
        subject_path: { type: string }
        field:
          type: string
          description: The changed field, or created or deleted.
        old:
          description: The value before; missing for something created.
        new:
          description: The value after; missing for something deleted.

    ConfigLevel:
      type: object
      required: [kind, id, path, name]
      properties:
        kind: { type: string, enum: [host, environment, project, customer, global] }
        id: { type: integer, format: int64 }
        path: { type: string }
        name: { type: string }

    ConfigValue:
      type: object
      required: [key, type, description, value, overrides]
      properties:
        key: { type: string, example: agent.interval.host }
        type: { type: string, enum: [duration, bool, window] }
        description: { type: string }
        value:
          description: The effective value.
        from:
          $ref: "#/components/schemas/ConfigLevel"
        overrides:
          type: array
          description: Values set further up that this one overrides, nearest first.
          items: { $ref: "#/components/schemas/ConfigOverride" }

    ConfigOverride:
      type: object
      required: [level, value]
      properties:
        level: { $ref: "#/components/schemas/ConfigLevel" }
        value: {}

    Enrollment:
      type: object
      required: [token, created_at, created_by, hub]
      properties:
        token:
          type: string
          description: The enrollment token, lotse_enr_….
        created_at: { type: integer, format: int64 }
        created_by: { type: string }
        hub:
          type: string
          description: The hub's address, for the install commands.

    Updates:
      type: object
      required: [hub_version, can_update_hub]
      properties:
        hub_version: { type: string }
        can_update_hub:
          type: boolean
          description: Whether the hub runs under the starter and can update itself.
        latest: { $ref: "#/components/schemas/Release" }
        checked_at:
          type: integer
          format: int64
          description: When the hub last looked.
        check_error:
          type: string
          description: Why the last look failed, if it did.

    Release:
      type: object
      required: [version, published_at, url, notes]
      properties:
        version: { type: string, example: 0.1.2 }
        published_at: { type: integer, format: int64 }
        url: { type: string }
        notes:
          type: string
          description: The release notes, in Markdown.

    Host:
      type: object
      required: [id, name, hostname, os, platform, kernel, arch, cpu_model, cores, mem_total,
        boot_time, agent_version, docker_version, first_seen, last_seen, online, agent_revoked]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        hostname: { type: string }
        os: { type: string }
        platform: { type: string }
        kernel: { type: string }
        arch: { type: string }
        cpu_model: { type: string }
        cores: { type: integer }
        mem_total: { type: integer, format: int64 }
        boot_time: { type: integer, format: int64 }
        agent_version: { type: string }
        docker_version:
          type: string
          description: Empty when the agent cannot reach Docker.
        first_seen: { type: integer, format: int64 }
        last_seen: { type: integer, format: int64 }
        online:
          type: boolean
          description: Whether its agent is connected now.
        agent_revoked:
          type: boolean
          description: Whether its agent's credential is revoked; it comes back only by enrolling again.
        environment_id:
          type: integer
          format: int64
          nullable: true
          description: Its environment; null until it is put into one.

    HostReading:
      type: object
      required: [ts]
      properties:
        ts: { type: integer, format: int64 }
        cpu: { type: number, format: double, nullable: true }
        iowait: { type: number, format: double, nullable: true }
        steal: { type: number, format: double, nullable: true }
        load1: { type: number, format: double, nullable: true }
        load5: { type: number, format: double, nullable: true }
        load15: { type: number, format: double, nullable: true }
        mem_used: { type: integer, format: int64, nullable: true }
        mem_available: { type: integer, format: int64, nullable: true }
        swap_used: { type: integer, format: int64, nullable: true }
        swap_total: { type: integer, format: int64, nullable: true }
        net_rx: { type: number, format: double, nullable: true }
        net_tx: { type: number, format: double, nullable: true }
        disk_read: { type: number, format: double, nullable: true }
        disk_write: { type: number, format: double, nullable: true }
        uptime: { type: integer, format: int64, nullable: true }

    HostSummary:
      type: object
      required: [host, containers]
      properties:
        host: { $ref: "#/components/schemas/Host" }
        latest: { $ref: "#/components/schemas/HostReading" }
        disk:
          type: number
          format: double
          nullable: true
          description: Usage of its fullest filesystem, in percent.
        containers: { $ref: "#/components/schemas/ContainerCounts" }

    ContainerCounts:
      type: object
      required: [total, running, unhealthy]
      properties:
        total: { type: integer }
        running: { type: integer }
        unhealthy: { type: integer }

    HostDetail:
      type: object
      required: [host, filesystems, containers]
      properties:
        host: { $ref: "#/components/schemas/Host" }
        latest: { $ref: "#/components/schemas/HostReading" }
        filesystems:
          type: array
          items: { $ref: "#/components/schemas/Filesystem" }
        containers:
          type: array
          description: Its containers, those still there first.
          items: { $ref: "#/components/schemas/Container" }

    Filesystem:
      type: object
      required: [id, mount, device, fstype, last_seen]
      properties:
        id: { type: integer, format: int64 }
        mount: { type: string }
        device: { type: string }
        fstype: { type: string }
        last_seen: { type: integer, format: int64 }
        used: { type: integer, format: int64, nullable: true }
        total: { type: integer, format: int64, nullable: true }

    Container:
      type: object
      required: [id, host_id, host_name, slug, docker_id, name, image, compose_project,
        compose_service, state, health, exit_code, restarts, started_at, labels,
        first_seen, last_seen]
      properties:
        id: { type: integer, format: int64 }
        host_id: { type: integer, format: int64 }
        host_name: { type: string }
        slug: { type: string }
        docker_id: { type: string }
        name: { type: string }
        image: { type: string }
        compose_project: { type: string }
        compose_service: { type: string }
        state:
          type: string
          description: Docker's state, such as running or exited.
        health:
          type: string
          description: Empty without a health check.
        exit_code: { type: integer }
        restarts: { type: integer }
        started_at: { type: integer, format: int64 }
        labels:
          type: object
          additionalProperties: { type: string }
        first_seen: { type: integer, format: int64 }
        last_seen: { type: integer, format: int64 }
        gone_at:
          type: integer
          format: int64
          nullable: true
          description: When its host last listed it, if it no longer does.
        latest: { $ref: "#/components/schemas/ContainerReading" }

    ContainerReading:
      type: object
      required: [ts]
      properties:
        ts: { type: integer, format: int64 }
        cpu:
          type: number
          format: double
          nullable: true
          description: Percent of one core.
        mem: { type: integer, format: int64, nullable: true }
        mem_limit: { type: integer, format: int64, nullable: true }
        net_rx: { type: number, format: double, nullable: true }
        net_tx: { type: number, format: double, nullable: true }

    Series:
      type: object
      description: >
        Readings in columns, as charts take them: time holds the start of
        each step, each column one value per step (null where nothing was
        measured).
      required: [time, step, columns]
      properties:
        time:
          type: array
          items: { type: integer, format: int64 }
        step:
          type: integer
          format: int64
          description: Seconds per step.
        columns:
          type: object
          additionalProperties:
            type: array
            items: { type: number, format: double, nullable: true }

    Event:
      type: object
      required: [id, ts, subject_kind, subject_id, kind, data]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: integer, format: int64 }
        subject_kind: { type: string, enum: [host, container] }
        subject_id: { type: integer, format: int64 }
        kind:
          type: string
          example: container.die
        data:
          type: object
          additionalProperties: true
