    get:
      operationId: exportScope
      summary: A scope as lotse.yaml
      tags: [read]
      security:
        - bearer: []
        - session: []
      parameters:
        - name: scope
          in: query
          description: The path of the scope, such as acme/shop; everything if not given.
          schema: { type: string }
      responses:
        "200":
          description: The document.
          content:
            application/yaml:
              schema: { type: string }
