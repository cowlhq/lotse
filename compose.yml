# Local development: `docker compose up --build`, then open the setup link
# from `docker compose logs hub`. It runs a hub on http://localhost:8080 (or
# the port in LOTSE_PORT) and three demo containers; the agent starts once
# it has an enrollment token (see below).
#
# With --profile postgres, Postgres runs as well; the hub uses it when
# LOTSE_DATABASE_URL is set, for example in a .env file:
#   LOTSE_DATABASE_URL=postgres://lotse:lotse@postgres:5432/lotse?sslmode=disable
services:
  hub:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: lotse:dev
    environment:
      LOTSE_URL: ${LOTSE_URL:-http://localhost:${LOTSE_PORT:-8080}}
      LOTSE_DATABASE_URL: ${LOTSE_DATABASE_URL:-}
    # LOTSE_BIND is the address the port listens on: 127.0.0.1 by default;
    # the machine's Tailscale address, for example, to reach it from the
    # tailnet. Put LOTSE_BIND, LOTSE_PORT and LOTSE_URL in a .env file next to
    # this one, so every docker compose command here uses them.
    ports:
      - "${LOTSE_BIND:-127.0.0.1}:${LOTSE_PORT:-8080}:8080"
    volumes:
      - hub:/var/lib/lotse
    depends_on:
      # Only with --profile postgres; without it, there is nothing to wait for.
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # The agent watches the machine Docker runs on: its / is mounted read-only
  # at /host, and the Docker socket to list containers. It runs as root to
  # read the socket. Even mounted read-only, the socket allows the whole
  # Docker API; see the docs for putting a socket proxy in between.
  #
  # It enrolls like any agent: after setup, "Add agent" on an environment
  # shows the line that starts it, LOTSE_TOKEN=… docker compose --profile
  # agent up -d.
  agent:
    image: lotse:dev
    profiles: [agent]
    command: ["start", "agent", "--hub", "http://hub:8080", "--insecure"]
    user: "0"
    environment:
      LOTSE_TOKEN: ${LOTSE_TOKEN:-}
      LOTSE_HOST_ROOT: /host
    volumes:
      - agent:/var/lib/lotse
      - /:/host:ro,rslave
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - hub
    restart: unless-stopped

  # Something to look at: a healthy, an unhealthy and a crashing container.
  demo-web:
    image: nginx:alpine
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 10s
    restart: unless-stopped
    labels:
      # A check of its own, from its labels (design 9.3); the hub reaches
      # it on the compose network.
      lotse.check.home.http.url: http://demo-web/
      lotse.check.home.http.keyword: nginx

  demo-sick:
    image: alpine
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "false"]
      interval: 10s
      retries: 2
    restart: unless-stopped

  demo-flaky:
    image: alpine
    command: ["sh", "-c", "sleep 120; echo giving up; exit 1"]
    restart: unless-stopped

  postgres:
    image: postgres:18
    profiles: [postgres]
    environment:
      POSTGRES_USER: lotse
      POSTGRES_PASSWORD: lotse
      POSTGRES_DB: lotse
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lotse"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  hub:
  agent:
  postgres:
